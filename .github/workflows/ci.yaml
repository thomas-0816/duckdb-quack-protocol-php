name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: "Validate using Composer"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          coverage: none
          tools: composer
      - name: Validate
        run: composer validate --strict

  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2022
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6
        thread-safety:
          - nts
          - zts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php-version }} ${{ matrix.thread-safety }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer
        env:
          phpts: ${{ matrix.thread-safety }}
      - name: Tests
        shell: bash
        env:
          BOX_REQUIREMENT_CHECKER: false
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   arch=linux-amd64   ;;
            Linux-ARM64) arch=linux-arm64   ;;
            macOS-ARM64) arch=osx-arm64     ;;
            Windows-X64) arch=windows-amd64 ;;
            *) echo "unsupported platform: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL "https://install.duckdb.org/v2.0.1/duckdb-cli-${arch}.tar.gz" | tar -xz -C "tests/"
          if [ -f tests/duckdb.exe ]; then
            mv tests/duckdb.exe tests/duckdb
          fi
          tests/duckdb --version
          uname -a
          php -v
          php -m | grep curl
          rm composer.lock
          composer install
          composer check

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          persona: pedantic
